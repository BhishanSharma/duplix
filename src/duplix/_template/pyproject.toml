[project]
name = "flight-alloc"
version = "0.0.1"
description = "IndiGo CLC flight-allocation system — engine + local web console"
requires-python = ">=3.11,<3.15"
dependencies = [
    "openpyxl~=3.1",
    "pydantic~=2.7",
    "ortools~=9.15",
    "pyyaml~=6.0",
]

[project.scripts]
flight-alloc = "src.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[project.optional-dependencies]
dev = ["pytest~=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
