<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Flight Allocation — Console</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<!--
  A shell, not a page. The tab strip, the panels and the overlays are
  rendered by js/ui/layout.js from the markup each module owns, so a new
  tab or a new drawer form never touches this file.

  Mount points:
    #tab-strip   the tab buttons          (js/ui/tabs.js)
    #panels      one <section> per view   (js/views/*)
    #overlays    sidebars + modals        (js/sidebar/*, js/drawer/*, js/ui/*)
-->
<body>

  <header class="topbar">
    <div class="brand">Flight Allocation</div>
    <nav class="tabs" id="tab-strip"></nav>
    <div class="topbar-actions">
      <span id="run-status-pill" class="run-pill" hidden></span>
      <button id="upload-btn" class="ghost" type="button"
              title="Upload today's Flight SV schedule" aria-label="Upload today's Flight SV schedule">
        Upload
      </button>
      <input id="flight-upload-input" type="file" accept=".xlsx" hidden>
      <input type="date" id="run-date"
             title="Allocation date — defaults to the server's date">
      <button id="reset-btn" class="ghost" type="button"
              title="Clear this session's results — uploads and overrides are kept">Reset</button>
      <button id="plan-btn" class="ghost" type="button"
              title="Clean flights + extract roster — preview before allocating">Plan</button>
      <button id="run-btn" class="primary" type="button">Allocate</button>
      <button id="export-btn" class="ghost icon-button" type="button"
              title="Download the current results as an Excel workbook" aria-label="Download Excel workbook">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"></path>
          <path d="m7 10 5 5 5-5"></path>
          <path d="M5 21h14"></path>
        </svg>
      </button>
      <button id="open-override" class="ghost" type="button" hidden
              title="Overrides — available after Plan completes">Override</button>
      <button id="open-setup" class="ghost icon-button" type="button"
              title="Roster files — set once per period" aria-label="Configuration">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2.12 2.12-.06-.06A1.65 1.65 0 0 0 15.8 18.6a1.65 1.65 0 0 0-1 1.51v.09h-3v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06-2.12-2.12.06-.06A1.65 1.65 0 0 0 7.2 15a1.65 1.65 0 0 0-1.51-1H5.6v-3h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06L8.93 6l.06.06A1.65 1.65 0 0 0 10.8 6.4a1.65 1.65 0 0 0 1-1.51V4.8h3v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06 2.12 2.12-.06.06A1.65 1.65 0 0 0 19.4 10c.14.61.67 1 1.29 1h.11v3h-.11c-.62 0-1.15.39-1.29 1Z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="panels"></main>

  <div id="overlays"></div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
